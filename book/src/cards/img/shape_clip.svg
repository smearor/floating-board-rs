<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Source Code Pro',ui-monospace,monospace">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98ad"/></marker></defs>
<rect width="700" height="380" rx="14" fill="#0a0e16" stroke="#1c2433"/>
<text x="350.0" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">SHAPE CLIP — the inner silhouette bound for Clipped content</text>
<polygon points="200.0,295.0 117.7,247.5 117.7,152.5 200.0,105.0 282.3,152.5 282.3,247.5" fill="#2e3440" stroke="#00a1e4" stroke-width="1.5"/>
<clipPath id="sc"><polygon points="200.0,280.0 130.7,240.0 130.7,160.0 200.0,120.0 269.3,160.0 269.3,240.0"/></clipPath>
<rect x="120" y="120" width="160" height="160" fill="#04e762" opacity="0.85" clip-path="url(#sc)"/>
<polygon points="200.0,280.0 130.7,240.0 130.7,160.0 200.0,120.0 269.3,160.0 269.3,240.0" fill="none" stroke="#dc0073" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="305" y1="105" x2="270" y2="140" stroke="#8b98ad" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
<text x="309" y="108" fill="#dc0073" font-size="10">ShapeClip</text>
<text x="309" y="120" fill="#8b98ad" font-size="8">inner silhouette</text>
<line x1="93" y1="260" x2="126" y2="240" stroke="#8b98ad" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>
<text x="15" y="264" fill="#8b98ad" font-size="9" text-anchor="start">ring stays card surface</text>
<text x="15" y="277" fill="#8b98ad" font-size="8" text-anchor="start">(drag affordance)</text>
<rect x="440" y="80" width="240" height="200" rx="10" fill="#10151f" stroke="#3a4560" stroke-width="1"/>
<text x="560" y="102" fill="#e8ecf4" font-size="11" text-anchor="middle">pick semantics</text>
<text x="460" y="138" fill="#04e762" font-size="10">inside silhouette:</text>
<text x="460" y="154" fill="#8b98ad" font-size="9">clip claims → propagates to card</text>
<text x="480" y="170" fill="#8b98ad" font-size="9">(drag / raise / gestures)</text>
<text x="460" y="200" fill="#dc0073" font-size="10">cut regions + hole:</text>
<text x="460" y="216" fill="#8b98ad" font-size="9">no leaf claim → pick falls through</text>
<text x="480" y="232" fill="#8b98ad" font-size="9">to the card below</text>
<text x="460" y="262" fill="#f5b700" font-size="10">mount:</text>
<text x="460" y="278" fill="#8b98ad" font-size="9">Clipped only, between overlay</text>
<text x="460" y="292" fill="#8b98ad" font-size="9">and content holder</text>
