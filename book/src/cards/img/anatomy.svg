<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="400" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="36" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">CARD ANATOMY — every element is opt-in</text>

  <!-- the card -->
  <rect x="200" y="90" width="260" height="236" rx="10" fill="#10151f" stroke="#00a1e4" stroke-width="1.5"/>

  <!-- header strip -->
  <rect x="200" y="90" width="260" height="42" rx="10" fill="#161c28" stroke="#00a1e4" stroke-width="1.5"/>
  <rect x="200" y="120" width="260" height="12" fill="#161c28"/>

  <!-- handle icon -->
  <g stroke="#8b98ad" stroke-width="2" stroke-linecap="round">
    <line x1="214" y1="105" x2="230" y2="105"/>
    <line x1="214" y1="111" x2="230" y2="111"/>
    <line x1="214" y1="117" x2="230" y2="117"/>
  </g>

  <!-- title -->
  <text x="330" y="115" fill="#e8ecf4" font-size="13" text-anchor="middle">Controls</text>

  <!-- fold button -->
  <rect x="412" y="102" width="16" height="16" rx="3" fill="none" stroke="#f5b700" stroke-width="1.5"/>
  <line x1="415" y1="110" x2="425" y2="110" stroke="#f5b700" stroke-width="1.5"/>

  <!-- close button -->
  <g stroke="#dc0073" stroke-width="1.8" stroke-linecap="round">
    <line x1="436" y1="104" x2="448" y2="116"/>
    <line x1="448" y1="104" x2="436" y2="116"/>
  </g>

  <!-- content area -->
  <rect x="212" y="144" width="236" height="158" rx="6" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="330" y="218" fill="#8b98ad" font-size="11" text-anchor="middle">consumer widget</text>
  <text x="330" y="234" fill="#3a4560" font-size="9" text-anchor="middle">.floating-card-content</text>

  <!-- rotate grip (bottom-left) -->
  <circle cx="214" cy="312" r="10" fill="none" stroke="#04e762" stroke-width="1.5"/>
  <path d="M 220 306 A 7 7 0 0 1 220 318" fill="none" stroke="#04e762" stroke-width="1.5"/>
  <polygon points="220,318 217,313 224,314" fill="#04e762"/>

  <!-- resize grip (bottom-right) -->
  <g stroke="#dc0073" stroke-width="1.8" stroke-linecap="round">
    <line x1="442" y1="320" x2="452" y2="310"/>
    <line x1="436" y1="320" x2="452" y2="304"/>
    <line x1="430" y1="320" x2="452" y2="298"/>
  </g>

  <!-- leader lines: ordered so none cross — each lands on the nearest edge -->
  <g stroke="#3a4560" stroke-width="1" stroke-dasharray="3 3">
    <line x1="178" y1="103" x2="212" y2="108"/>
    <line x1="178" y1="144" x2="304" y2="112"/>
    <line x1="178" y1="212" x2="210" y2="216"/>
    <line x1="178" y1="295" x2="203" y2="308"/>
    <line x1="482" y1="103" x2="428" y2="110"/>
    <line x1="482" y1="144" x2="444" y2="110"/>
    <line x1="482" y1="295" x2="452" y2="303"/>
  </g>

  <!-- left legend -->
  <g font-size="10" text-anchor="end">
    <text x="170" y="97" fill="#8b98ad">handle —</text>
    <text x="170" y="111" fill="#e8ecf4">DragHandle::Handle</text>

    <text x="170" y="138" fill="#8b98ad">title —</text>
    <text x="170" y="152" fill="#e8ecf4">Option&lt;String&gt;</text>

    <text x="170" y="207" fill="#e8ecf4">content area</text>
    <text x="170" y="221" fill="#8b98ad">content_padding · size caps</text>

    <text x="170" y="290" fill="#04e762">rotate grip — rotate_grip</text>
    <text x="170" y="304" fill="#8b98ad">quarter-turn swipe</text>
  </g>

  <!-- right legend -->
  <g font-size="10">
    <text x="490" y="97" fill="#f5b700">fold — foldable</text>
    <text x="490" y="111" fill="#8b98ad">collapses to header</text>

    <text x="490" y="138" fill="#dc0073">close — closable</text>
    <text x="490" y="152" fill="#8b98ad">CardCloseAction</text>

    <text x="490" y="290" fill="#dc0073">resize grip — resizable</text>
    <text x="490" y="304" fill="#8b98ad">scale around center</text>
  </g>

  <text x="330" y="372" fill="#8b98ad" font-size="10" text-anchor="middle">the card owns no geometry — FloatingBoard is the single state owner</text>
</svg>
