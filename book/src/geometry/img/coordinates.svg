<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="360" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">COORDINATE SPACES — workspace → view → widget</text>

  <!-- workspace plane -->
  <rect x="40" y="64" width="270" height="236" rx="10" fill="#0a0e16" stroke="#89fc00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="175" y="84" fill="#89fc00" font-size="11" text-anchor="middle">workspace — domain truth</text>

  <!-- cards in workspace -->
  <g transform="rotate(15 110 140)">
    <rect x="84" y="120" width="52" height="40" rx="5" fill="#10151f" stroke="#00a1e4" stroke-width="1.4"/>
  </g>
  <g transform="rotate(-30 240 220)">
    <rect x="214" y="200" width="52" height="40" rx="5" fill="#10151f" stroke="#dc0073" stroke-width="1.4"/>
  </g>
  <circle cx="110" cy="140" r="3" fill="#00a1e4"/>
  <circle cx="240" cy="220" r="3" fill="#dc0073"/>
  <text x="110" y="172" fill="#8b98ad" font-size="8.5" text-anchor="middle">CardPosition = center</text>

  <!-- view region over workspace -->
  <g transform="rotate(-12 175 182)">
    <rect x="88" y="118" width="174" height="128" rx="6" fill="none" stroke="#f5b700" stroke-width="2"/>
  </g>
  <text x="268" y="118" fill="#f5b700" font-size="9.5">View { region, rotation }</text>

  <!-- mapping arrows -->
  <line x1="316" y1="160" x2="356" y2="160" stroke="#e8ecf4" stroke-width="1.5"/>
  <polygon points="356,160 349,157 349,163" fill="#e8ecf4"/>
  <text x="336" y="152" fill="#e8ecf4" font-size="8.5" text-anchor="middle">to_widget</text>
  <line x1="356" y1="204" x2="316" y2="204" stroke="#8b98ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="316,204 323,201 323,207" fill="#8b98ad"/>
  <text x="336" y="216" fill="#8b98ad" font-size="8.5" text-anchor="middle">to_workspace</text>

  <!-- widget -->
  <rect x="372" y="100" width="248" height="164" rx="10" fill="#0a0e16" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="496" y="120" fill="#00a1e4" font-size="11" text-anchor="middle">widget — gtk4::Fixed layer</text>
  <g transform="rotate(-12 496 182)">
    <rect x="438" y="146" width="56" height="42" rx="5" fill="#10151f" stroke="#00a1e4" stroke-width="1.4"/>
    <rect x="508" y="188" width="56" height="42" rx="5" fill="#10151f" stroke="#dc0073" stroke-width="1.4"/>
  </g>
  <text x="496" y="252" fill="#3a4560" font-size="8.5" text-anchor="middle">top-left put + gsk::Transform stack</text>

  <text x="330" y="330" fill="#8b98ad" font-size="10" text-anchor="middle">sticky cards break the rule — while pinned they store widget coordinates</text>
  <text x="330" y="346" fill="#3a4560" font-size="9" text-anchor="middle">center anchor: rotation and scale never move the point a user points at</text>
</svg>
