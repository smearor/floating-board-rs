<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="320" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">WORKSPACE SIZE — where the edges of the world are</text>

  <!-- FollowWidget -->
  <rect x="40" y="56" width="180" height="200" rx="10" fill="#0a0e16" stroke="#1c2433"/>
  <text x="130" y="78" fill="#00a1e4" font-size="10.5" text-anchor="middle">FollowWidget</text>
  <rect x="66" y="96" width="128" height="96" rx="6" fill="none" stroke="#89fc00" stroke-width="1.6"/>
  <rect x="66" y="96" width="128" height="96" rx="6" fill="none" stroke="#f5b700" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="96" y="126" width="34" height="26" rx="4" fill="#10151f" stroke="#00a1e4" stroke-width="1.2"/>
  <text x="130" y="212" fill="#8b98ad" font-size="8.5" text-anchor="middle">workspace ≡ allocation</text>
  <text x="130" y="226" fill="#3a4560" font-size="8.5" text-anchor="middle">default · mirrors resize</text>

  <!-- Fixed -->
  <rect x="240" y="56" width="180" height="200" rx="10" fill="#0a0e16" stroke="#1c2433"/>
  <text x="330" y="78" fill="#04e762" font-size="10.5" text-anchor="middle">Fixed(w × h)</text>
  <rect x="252" y="90" width="156" height="120" rx="6" fill="none" stroke="#89fc00" stroke-width="1.6"/>
  <rect x="288" y="110" width="84" height="62" rx="5" fill="none" stroke="#f5b700" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="296" y="122" width="30" height="22" rx="4" fill="#10151f" stroke="#00a1e4" stroke-width="1.2"/>
  <g transform="rotate(25 386 150)">
    <rect x="372" y="138" width="28" height="22" rx="4" fill="#10151f" stroke="#dc0073" stroke-width="1.2"/>
  </g>
  <text x="330" y="228" fill="#8b98ad" font-size="8.5" text-anchor="middle">a table bigger than the widget</text>
  <text x="330" y="242" fill="#3a4560" font-size="8.5" text-anchor="middle">clamps to the workspace rect</text>

  <!-- Infinite -->
  <rect x="440" y="56" width="180" height="200" rx="10" fill="#0a0e16" stroke="#1c2433"/>
  <text x="530" y="78" fill="#dc0073" font-size="10.5" text-anchor="middle">Infinite</text>
  <rect x="452" y="90" width="156" height="120" rx="6" fill="none" stroke="#89fc00" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.35"/>
  <rect x="488" y="110" width="84" height="62" rx="5" fill="none" stroke="#f5b700" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="496" y="122" width="30" height="22" rx="4" fill="#10151f" stroke="#00a1e4" stroke-width="1.2"/>
  <g transform="rotate(-20 586 190)">
    <rect x="572" y="178" width="28" height="22" rx="4" fill="#10151f" stroke="#dc0073" stroke-width="1.2"/>
  </g>
  <text x="530" y="228" fill="#8b98ad" font-size="8.5" text-anchor="middle">no extent exists</text>
  <text x="530" y="242" fill="#3a4560" font-size="8.5" text-anchor="middle">clamps to the shown region</text>

  <text x="330" y="288" fill="#8b98ad" font-size="10" text-anchor="middle">workspace bounds — solid — and the widget's view window — dashed</text>
  <text x="330" y="304" fill="#3a4560" font-size="9" text-anchor="middle">persisted in BoardLayout; old files read back as FollowWidget</text>
</svg>
