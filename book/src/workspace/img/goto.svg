<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="320" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">GOTO_CARD — three ways to fly</text>

  <!-- Snap -->
  <text x="80" y="72" fill="#f5b700" font-size="10.5">Snap</text>
  <rect x="60" y="84" width="52" height="38" rx="5" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="86" y="108" fill="#3a4560" font-size="8.5" text-anchor="middle">from</text>
  <line x1="120" y1="103" x2="270" y2="103" stroke="#f5b700" stroke-width="1.8" stroke-dasharray="7 5"/>
  <polygon points="270,103 261,99 261,107" fill="#f5b700"/>
  <rect x="278" y="84" width="52" height="38" rx="5" fill="#10151f" stroke="#00a1e4" stroke-width="1.4"/>
  <text x="304" y="108" fill="#8b98ad" font-size="8.5" text-anchor="middle">card</text>
  <text x="420" y="103" fill="#8b98ad" font-size="9.5">instant — no flight</text>

  <!-- Glide -->
  <text x="80" y="162" fill="#04e762" font-size="10.5">Glide</text>
  <rect x="60" y="174" width="52" height="38" rx="5" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 112 193 C 180 160, 220 160, 272 188" fill="none" stroke="#04e762" stroke-width="1.8"/>
  <polygon points="272,188 262,187 267,194" fill="#04e762"/>
  <rect x="278" y="174" width="52" height="38" rx="5" fill="#10151f" stroke="#00a1e4" stroke-width="1.4"/>
  <text x="304" y="198" fill="#8b98ad" font-size="8.5" text-anchor="middle">card</text>
  <text x="420" y="193" fill="#8b98ad" font-size="9.5">pan · zoom · rotation glide together</text>

  <!-- Transit -->
  <text x="80" y="252" fill="#dc0073" font-size="10.5">Transit</text>
  <rect x="60" y="264" width="52" height="38" rx="5" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 112 283 C 170 240, 250 240, 300 268" fill="none" stroke="#dc0073" stroke-width="1.8"/>
  <polygon points="300,268 290,267 295,274" fill="#dc0073"/>
  <circle cx="206" cy="242" r="4" fill="#dc0073"/>
  <text x="206" y="232" fill="#dc0073" font-size="8" text-anchor="middle">overview waypoint</text>
  <rect x="278" y="264" width="52" height="38" rx="5" fill="#10151f" stroke="#00a1e4" stroke-width="1.4"/>
  <text x="304" y="288" fill="#8b98ad" font-size="8.5" text-anchor="middle">card</text>
  <text x="420" y="278" fill="#8b98ad" font-size="9.5">pulls back over both regions, then</text>
  <text x="420" y="292" fill="#8b98ad" font-size="9.5">glides down — Prezi style</text>

  <!-- card mini in upper right -->
  <g transform="rotate(-8 560 100)">
    <rect x="530" y="80" width="60" height="44" rx="5" fill="#10151f" stroke="#00a1e4" stroke-width="1.3"/>
    <rect x="530" y="80" width="60" height="12" rx="5" fill="#161c28" stroke="#00a1e4" stroke-width="1"/>
  </g>
  <text x="560" y="146" fill="#3a4560" font-size="8.5" text-anchor="middle">target view = footprint × 1.5</text>
</svg>
