<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="360" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">PASSING — a card hops the perimeter and turns to read upright</text>

  <!-- table -->
  <rect x="150" y="64" width="300" height="210" rx="12" fill="#10151f" stroke="#1c2433"/>

  <!-- source card at bottom edge -->
  <rect x="260" y="252" width="60" height="40" rx="5" fill="none" stroke="#00a1e4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="290" y="310" fill="#00a1e4" font-size="9" text-anchor="middle">from: Bottom seat</text>

  <!-- occupied edge fan-out at left -->
  <g transform="rotate(90 130 160)">
    <rect x="112" y="146" width="56" height="36" rx="4" fill="#10151f" stroke="#04e762" stroke-width="1.4"/>
  </g>
  <g transform="rotate(90 130 216)">
    <rect x="112" y="202" width="56" height="28" rx="4" fill="#10151f" stroke="#3a4560" stroke-width="1.2"/>
  </g>
  <!-- arriving card beside them (fan-out lane) -->
  <g transform="rotate(90 196 160)">
    <rect x="172" y="146" width="56" height="36" rx="4" fill="#10151f" stroke="#f5b700" stroke-width="1.6"/>
  </g>
  <text x="196" y="216" fill="#f5b700" font-size="8.5" text-anchor="middle" transform="rotate(-90 196 216)">nearest free spot</text>

  <!-- hop arrow -->
  <path d="M 288 246 C 250 236, 210 220, 196 192" fill="none" stroke="#f5b700" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="196,192 193,201 202,196" fill="#f5b700"/>
  <text x="252" y="206" fill="#f5b700" font-size="9" transform="rotate(35 252 206)">Clockwise</text>

  <!-- notes right -->
  <g font-size="10">
    <rect x="480" y="80" width="150" height="70" rx="8" fill="#10151f" stroke="#1c2433"/>
    <text x="555" y="102" fill="#e8ecf4" font-size="9.5" text-anchor="middle">rotate_to_next_user</text>
    <text x="555" y="120" fill="#8b98ad" font-size="8.5" text-anchor="middle">next table side —</text>
    <text x="555" y="134" fill="#8b98ad" font-size="8.5" text-anchor="middle">glide + reading rotation</text>

    <rect x="480" y="164" width="150" height="80" rx="8" fill="#10151f" stroke="#1c2433"/>
    <text x="555" y="186" fill="#e8ecf4" font-size="9" text-anchor="middle">rotate_to_next_</text>
    <text x="555" y="200" fill="#e8ecf4" font-size="9" text-anchor="middle">occupied_seat</text>
    <text x="555" y="218" fill="#8b98ad" font-size="8.5" text-anchor="middle">hops a roster, assigns</text>
    <text x="555" y="232" fill="#8b98ad" font-size="8.5" text-anchor="middle">the reached seat</text>
  </g>

  <text x="330" y="330" fill="#8b98ad" font-size="10" text-anchor="middle">the fan-out lane fills gaps beside occupied cards — edge lane preferred</text>
  <text x="330" y="346" fill="#3a4560" font-size="9" text-anchor="middle">NoNextSeat when the roster holds only the card's own seat</text>
</svg>
