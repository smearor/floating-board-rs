<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="360" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">SEATS — who a card belongs to, not which way it is turned</text>

  <!-- table -->
  <rect x="130" y="70" width="250" height="180" rx="12" fill="#10151f" stroke="#1c2433"/>
  <text x="255" y="166" fill="#3a4560" font-size="10" text-anchor="middle">table surface</text>

  <!-- Bottom side: upright cards -->
  <rect x="180" y="256" width="34" height="22" rx="3" fill="#10151f" stroke="#00a1e4" stroke-width="1.5"/>
  <rect x="246" y="256" width="34" height="22" rx="3" fill="#10151f" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="255" y="300" fill="#00a1e4" font-size="10" text-anchor="middle">Bottom — reads upright</text>

  <!-- Top side: flipped card -->
  <g transform="rotate(180 262 60)">
    <rect x="245" y="49" width="34" height="22" rx="3" fill="#10151f" stroke="#f5b700" stroke-width="1.5"/>
  </g>
  <text x="255" y="52" fill="#f5b700" font-size="10" text-anchor="middle">Top — Deg180</text>

  <!-- Left side -->
  <g transform="rotate(90 104 160)">
    <rect x="87" y="149" width="34" height="22" rx="3" fill="#10151f" stroke="#04e762" stroke-width="1.5"/>
  </g>
  <text x="60" y="164" fill="#04e762" font-size="10" text-anchor="middle" transform="rotate(-90 60 164)">Left — Deg90</text>

  <!-- Right side -->
  <g transform="rotate(-90 406 160)">
    <rect x="389" y="149" width="34" height="22" rx="3" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  </g>
  <text x="452" y="164" fill="#dc0073" font-size="10" text-anchor="middle" transform="rotate(90 452 164)">Right — Deg270</text>

  <!-- seat anatomy panel -->
  <rect x="450" y="70" width="180" height="180" rx="10" fill="#10151f" stroke="#1c2433"/>
  <text x="540" y="94" fill="#8b98ad" font-size="10" letter-spacing="1.5" text-anchor="middle">SEAT</text>
  <g font-size="9.5" fill="#e8ecf4">
    <text x="466" y="118">side: TableSide</text>
    <text x="466" y="136">offset: Option&lt;Fraction&gt;</text>
  </g>
  <g font-size="9.5" fill="#8b98ad">
    <text x="466" y="162">None → strategy</text>
    <text x="466" y="176">distributes along edge</text>
    <text x="466" y="198">Some(f) → pinned</text>
    <text x="466" y="212">Seat::at / Seat::center</text>
  </g>
  <text x="540" y="238" fill="#8b98ad" font-size="8.5" text-anchor="middle">independent of rotation —</text>
  <text x="540" y="250" fill="#8b98ad" font-size="8.5" text-anchor="middle">serialized in BoardLayout</text>

  <!-- anchor note -->
  <rect x="450" y="268" width="180" height="62" rx="8" fill="#10151f" stroke="#f5b700" stroke-width="1.2"/>
  <text x="540" y="290" fill="#f5b700" font-size="9.5" text-anchor="middle">SeatAnchor::View —</text>
  <text x="540" y="304" fill="#8b98ad" font-size="9" text-anchor="middle">edges follow the screen,</text>
  <text x="540" y="318" fill="#8b98ad" font-size="9" text-anchor="middle">not the virtual table</text>

  <text x="330" y="346" fill="#8b98ad" font-size="10" text-anchor="middle">cards at a side face their user — upside down for the Top seat</text>
</svg>
