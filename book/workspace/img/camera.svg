<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="360" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">THE CAMERA — a view floating over the workspace</text>

  <!-- workspace -->
  <rect x="50" y="60" width="340" height="230" rx="10" fill="#0a0e16" stroke="#89fc00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="220" y="82" fill="#89fc00" font-size="10.5" text-anchor="middle">workspace</text>

  <!-- cards -->
  <rect x="80" y="106" width="46" height="34" rx="4" fill="#10151f" stroke="#00a1e4" stroke-width="1.3"/>
  <g transform="rotate(30 330 240)">
    <rect x="307" y="223" width="46" height="34" rx="4" fill="#10151f" stroke="#dc0073" stroke-width="1.3"/>
  </g>
  <rect x="180" y="240" width="46" height="34" rx="4" fill="#10151f" stroke="#f5b700" stroke-width="1.3"/>

  <!-- view region -->
  <g transform="rotate(-15 210 175)">
    <rect x="110" y="105" width="200" height="140" rx="6" fill="#f5b700" opacity="0.07"/>
    <rect x="110" y="105" width="200" height="140" rx="6" fill="none" stroke="#f5b700" stroke-width="2"/>
  </g>
  <text x="318" y="112" fill="#f5b700" font-size="9.5">View { region, rotation }</text>
  <text x="318" y="126" fill="#8b98ad" font-size="8.5">pinned or following</text>

  <!-- pan arrow -->
  <line x1="450" y1="100" x2="540" y2="100" stroke="#00a1e4" stroke-width="1.6"/>
  <polygon points="540,100 533,97 533,103" fill="#00a1e4"/>
  <line x1="540" y1="100" x2="450" y2="100" stroke="#00a1e4" stroke-width="1.6" opacity="0.4"/>
  <polygon points="450,100 457,97 457,103" fill="#00a1e4" opacity="0.4"/>
  <text x="495" y="90" fill="#00a1e4" font-size="10" text-anchor="middle">pan_view</text>

  <!-- zoom arrows -->
  <line x1="495" y1="160" x2="525" y2="140" stroke="#04e762" stroke-width="1.6"/>
  <polygon points="525,140 517,141 522,147" fill="#04e762"/>
  <line x1="495" y1="160" x2="465" y2="180" stroke="#04e762" stroke-width="1.6" opacity="0.5"/>
  <polygon points="465,180 473,179 468,173" fill="#04e762" opacity="0.5"/>
  <text x="495" y="158" fill="#04e762" font-size="10" text-anchor="middle">zoom_view</text>

  <!-- rotate arc -->
  <path d="M 540 220 A 36 36 0 0 1 540 280" fill="none" stroke="#dc0073" stroke-width="1.6"/>
  <polygon points="540,280 534,273 542,272" fill="#dc0073"/>
  <text x="495" y="254" fill="#dc0073" font-size="10" text-anchor="middle">rotate_view</text>

  <!-- reset -->
  <rect x="450" y="296" width="170" height="34" rx="8" fill="#10151f" stroke="#1c2433"/>
  <text x="535" y="317" fill="#e8ecf4" font-size="9.5" text-anchor="middle">reset_view releases the pin</text>

  <text x="330" y="322" fill="#8b98ad" font-size="10" text-anchor="middle">cards never move when the camera does — pan, zoom, rotate are view ops</text>
  <text x="330" y="338" fill="#3a4560" font-size="9" text-anchor="middle">view gestures and corner buttons are opt-in; card gestures claim first</text>
</svg>
