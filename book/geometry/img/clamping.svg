<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Source Code Pro',ui-monospace,monospace">
  <rect width="660" height="340" rx="14" fill="#0a0e16" stroke="#1c2433"/>

  <text x="330" y="34" fill="#8b98ad" font-size="11" letter-spacing="2" text-anchor="middle">BOUNDARY CLAMPING — footprint vs. bounds</text>

  <!-- Loose panel -->
  <rect x="40" y="56" width="270" height="230" rx="10" fill="#0a0e16" stroke="#1c2433"/>
  <text x="175" y="78" fill="#f5b700" font-size="11" text-anchor="middle">Loose (default)</text>

  <!-- bounds -->
  <rect x="66" y="94" width="218" height="166" rx="8" fill="none" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="76" y="110" fill="#00a1e4" font-size="8.5">bounds</text>

  <!-- card sticking out -->
  <g transform="rotate(20 268 220)">
    <rect x="230" y="196" width="76" height="48" rx="5" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  </g>
  <!-- min_visible strip -->
  <rect x="252" y="226" width="32" height="26" rx="3" fill="#f5b700" opacity="0.25"/>
  <line x1="252" y1="226" x2="284" y2="252" stroke="#f5b700" stroke-width="1" opacity="0.6"/>
  <text x="175" y="276" fill="#8b98ad" font-size="9" text-anchor="middle">keeps ≥ min_visible px inside —</text>
  <text x="175" y="288" fill="#8b98ad" font-size="9" text-anchor="middle">clamped on gesture end</text>

  <!-- Contained panel -->
  <rect x="350" y="56" width="270" height="230" rx="10" fill="#0a0e16" stroke="#1c2433"/>
  <text x="485" y="78" fill="#04e762" font-size="11" text-anchor="middle">Contained</text>

  <rect x="376" y="94" width="218" height="166" rx="8" fill="none" stroke="#00a1e4" stroke-width="1.5"/>
  <text x="386" y="110" fill="#00a1e4" font-size="8.5">bounds</text>

  <g transform="rotate(20 480 180)">
    <rect x="442" y="156" width="76" height="48" rx="5" fill="#10151f" stroke="#dc0073" stroke-width="1.5"/>
  </g>
  <!-- footprint AABB -->
  <rect x="438" y="140" width="84" height="76" rx="2" fill="none" stroke="#04e762" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="480" y="134" fill="#04e762" font-size="8.5" text-anchor="middle">rotated footprint AABB</text>
  <text x="485" y="276" fill="#8b98ad" font-size="9" text-anchor="middle">the whole footprint stays inside —</text>
  <text x="485" y="288" fill="#8b98ad" font-size="9" text-anchor="middle">clamped live during gestures</text>

  <text x="330" y="316" fill="#8b98ad" font-size="10" text-anchor="middle">clamp_offset(footprint, bounds, min_visible) → minimal (dx, dy)</text>
  <text x="330" y="330" fill="#3a4560" font-size="9" text-anchor="middle">Infinite workspaces clamp against the shown view region</text>
</svg>
