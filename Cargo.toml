[package]
name = "floating-board"
version = "0.1.0"
description = "GTK4 widget with floating, rotatable and scalable cards (like an in-app window manager)"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/smearor/floating-board-rs"
homepage = "https://smearor.io/"
rust-version = "1.98.0"

[features]
default = ["serde"]
serde = ["dep:serde"]
adwaita = ["dep:libadwaita"]

[dependencies]
fluent-bundle = "0.16"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_20"] }
libadwaita = { version = "0.9.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
smearor-commons-animation = { git = "https://github.com/smearor/smearor-commons.git", features = ["gtk4"] }
smearor-commons-color = { git = "https://github.com/smearor/smearor-commons.git" }
smearor-commons-geometry = { git = "https://github.com/smearor/smearor-commons.git", features = ["cairo", "gtk4"] }
smearor-commons-layout = { git = "https://github.com/smearor/smearor-commons.git" }
smearor-wrot-rotation = { git = "https://github.com/smearor/smearor-wrot-rotation.git" }
thiserror = "2"
tracing = "0.1"
unic-langid = { version = "0.9", features = ["macros"] }

[dev-dependencies]
serde_json = "1.0"
toml = "1.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

# Local override until the `contains` delegation in `RotationWidgetImpl`
# (leaf picks in a rotated child's invisible corners were swallowed by
# the transform wrapper) lands upstream.
#[patch."https://github.com/smearor/smearor-wrot-rotation.git"]
#smearor-wrot-rotation = { path = "../smearor-wrot-rotation" }
