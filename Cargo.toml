[package]
name = "floating-board"
version = "0.1.0"
description = "GTK4 widget with floating, rotatable and scalable cards (like an in-app window manager)"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/smearor/floating-board-rs"
homepage = "https://smearor.io/"
rust-version = "1.98.0"

[features]
default = ["serde"]
serde = ["dep:serde"]
adwaita = ["dep:libadwaita"]
fx = ["dep:smearor-commons-fx"]

[dependencies]
fluent-bundle = "0.16"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_20"] }
libadwaita = { version = "0.9.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
smearor-commons-animation = { git = "https://github.com/smearor/smearor-commons.git", features = ["gtk4"] }
smearor-commons-color = { git = "https://github.com/smearor/smearor-commons.git", features = ["cairo", "gtk4"] }
smearor-commons-geometry = { git = "https://github.com/smearor/smearor-commons.git", features = ["cairo", "gtk4"] }
smearor-commons-fx = { git = "https://github.com/smearor/smearor-commons.git", features = ["gtk4"], optional = true }
smearor-commons-layout = { git = "https://github.com/smearor/smearor-commons.git" }
smearor-wrot-rotation = { git = "https://github.com/smearor/smearor-wrot-rotation.git" }
thiserror = "2"
tracing = "0.1"
unic-langid = { version = "0.9", features = ["macros"] }

[dev-dependencies]
serde_json = "1.0"
smearor-commons-drawing = { git = "https://github.com/smearor/smearor-commons.git", features = ["cairo", "gtk4"] }
smearor-commons-fx = { git = "https://github.com/smearor/smearor-commons.git", features = ["gtk4"] }
toml = "1.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

[patch."https://github.com/smearor/smearor-commons.git"]
smearor-commons-animation = { path = "../smearor-commons/crates/animation" }
smearor-commons-buffer = { path = "../smearor-commons/crates/buffer" }
smearor-commons-color = { path = "../smearor-commons/crates/color" }
smearor-commons-drawing = { path = "../smearor-commons/crates/drawing" }
smearor-commons-font = { path = "../smearor-commons/crates/font" }
smearor-commons-fx = { path = "../smearor-commons/crates/fx" }
smearor-commons-geometry = { path = "../smearor-commons/crates/geometry" }
smearor-commons-layer = { path = "../smearor-commons/crates/layer" }
smearor-commons-layout = { path = "../smearor-commons/crates/layout" }
